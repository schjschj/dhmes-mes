<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1f3354">
<title>명세서 촬영</title>
<style>
  /* [구매관리] 휴대폰으로 거래명세서 촬영 → 글자 읽기(OCR) → 확인 · 고침 → MES 등록 */
  :root { --bg:#f3f5f8; --panel:#fff; --line:#d9dee6; --ink:#1d2533; --muted:#6b7585; --accent:#2f6fd0; --ok:#2f8f46; --bad:#c83a3a; --warn:#b07000; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:16px; -webkit-tap-highlight-color:transparent; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#1f3354; color:#fff; position:sticky; top:0; z-index:5; }
  header b { font-size:18px; } header .grow { flex:1; } header span { font-size:13px; opacity:.85; }
  main { padding:12px; max-width:640px; margin:0 auto; padding-bottom:40px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
  .btn { display:block; width:100%; border:2px solid var(--line); background:var(--panel); border-radius:12px; padding:14px; font:inherit; font-weight:700; min-height:52px; cursor:pointer; color:inherit; text-align:center; }
  .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; } .btn.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn.big { font-size:20px; min-height:84px; } .btn:disabled { opacity:.5; }
  .row { display:flex; gap:8px; margin:8px 0; } .row > * { flex:1; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 3px; }
  input { width:100%; font:inherit; font-size:17px; padding:10px; border:2px solid var(--line); border-radius:10px; background:#fff; color:inherit; }
  input:focus { border-color:var(--accent); outline:none; }
  .msg { padding:12px; border-radius:10px; margin:8px 0; font-weight:700; } .msg.bad { background:#fdeeee; color:var(--bad); } .msg.ok { background:#eef8f0; color:var(--ok); } .msg.warn { background:#fff6e0; color:var(--warn); }
  .muted { color:var(--muted); font-size:13px; }
  .photo { width:100%; max-height:46vh; object-fit:contain; background:#222; border-radius:10px; display:block; }
  .it { border:1px solid var(--line); border-radius:12px; padding:10px; margin:8px 0; background:#fafbfc; }
  .it .h { display:flex; align-items:center; gap:8px; font-weight:700; } .it .h .x { margin-left:auto; width:auto; min-height:0; padding:4px 10px; font-size:13px; }
  .g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; } .g2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:700; background:#e3edfc; color:var(--accent); }
  .tag.ok { background:#e5f4e8; color:var(--ok); } .tag.warn { background:#fff1d6; color:var(--warn); }
  .rec { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .rec:first-child { border-top:0; }
  .login { max-width:380px; margin:10vh auto; }
  .busy { text-align:center; padding:40px 10px; } .spin { width:42px; height:42px; border:4px solid var(--line); border-top-color:var(--accent); border-radius:50%; margin:0 auto 14px; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#1d2533; color:#fff; padding:12px 18px; border-radius:10px; font-size:15px; display:none; z-index:20; max-width:90vw; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<header><b>거래명세서 촬영</b><span class="grow"></span><span id="who"></span></header>
<main id="main"><div class="muted">불러오는 중…</div></main>
<input type="file" id="cam" accept="image/*" capture="environment">
<input type="file" id="gal" accept="image/*">
<div id="toast"></div>
<script>
(function () {
  'use strict';
  var CFG = null, shot = null, R = null;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem('rcm_' + k); localStorage.setItem('rcm_' + k, v); } catch (e) { return null; } }
  function toast(m, ms) { var t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, ms || 2500); }
  function won(v) { return v == null || v === '' || isNaN(v) ? '' : Math.round(+v).toLocaleString('ko-KR'); }
  function num(v) { v = String(v == null ? '' : v).replace(/[,\s원₩]/g, ''); return v === '' || isNaN(v) ? null : +v; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function api(method, url, body, raw) {
    return fetch(url, { method: method, credentials: 'same-origin', headers: body ? { 'Content-Type': raw ? 'image/jpeg' : 'application/json' } : {}, body: body ? (raw ? body : JSON.stringify(body)) : undefined })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (r.status === 401) { login(); throw new Error('로그인이 필요합니다.'); }
          if (r.status === 403) throw new Error('구매관리 권한이 없습니다. 사무실에서 사용자 · 권한의 구매관리 입력 권한을 받으세요.');
          if (!r.ok) throw new Error(j.error || j.message || '오류 ' + r.status);
          return j;
        });
      }, function () { throw new Error('MES 서버에 연결할 수 없습니다 (같은 회사 Wi-Fi 인지 확인).'); });
  }
  function isMold(name) {
    var n = String(name || '').replace(/\s|\(주\)|㈜|주식회사/g, '');
    return !!(CFG && CFG.mold_suppliers.some(function (s) { return s && n.indexOf(s.replace(/\s/g, '')) >= 0; }));
  }

  // ── 로그인
  function login(msg) {
    $('#who').textContent = '';
    $('#main').innerHTML = '<div class="card login"><h2 style="margin-top:0">MES 로그인</h2>' + (msg ? '<div class="msg bad">' + esc(msg) + '</div>' : '') +
      '<label>아이디</label><input id="lid" autocomplete="username" autocapitalize="off"><label>비밀번호</label><input id="lpw" type="password" autocomplete="current-password">' +
      '<div class="row"><button class="btn pri" id="lgo">로그인</button></div><div class="muted">MES 계정(구매관리 입력 권한)으로 로그인합니다. 한 번 로그인하면 이 휴대폰에서 유지됩니다.</div></div>';
    var go = function () {
      api('POST', '/api/login', { login: $('#lid').value.trim(), password: $('#lpw').value, remember: true }).then(function (r) {
        store('name', (r.me && r.me.name) || '');
        start();
      }).catch(function (e) { login(e.message); });
    };
    $('#lgo').onclick = go;
    $('#lpw').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }
  function start() {
    api('GET', '/api/rc/cfg').then(function (c) {
      CFG = c;
      $('#who').textContent = store('name') || '';
      home();
    }).catch(function (e) { if (e.message !== '로그인이 필요합니다.') $('#main').innerHTML = '<div class="msg bad">' + esc(e.message) + '</div><button class="btn" onclick="location.reload()">다시 시도</button>'; });
  }

  // ── 첫 화면: 촬영 + 최근 등록
  function home(done) {
    shot = null; R = null;
    $('#main').innerHTML = (done ? done : '') +
      '<button class="btn big pri" id="bCam">📷 명세서 사진 찍기</button>' +
      '<div class="row"><button class="btn" id="bGal">앨범에서 고르기</button></div>' +
      '<div class="muted" style="margin:4px 2px 14px">명세서를 밝은 곳에 펴 놓고 표 전체가 화면에 꽉 차게 찍으세요. 옆으로 찍어도 됩니다 (자동으로 돌림).<br>' +
      '금형부품 업체(' + esc((CFG.mold_suppliers || []).join(' · ')) + ')는 금형부품 재고에 바로 입고되고, 나머지는 일반 거래명세서로 정리됩니다.</div>' +
      '<div class="card"><b>최근 등록</b><div id="recent" class="muted" style="margin-top:6px">불러오는 중…</div></div>';
    $('#bCam').onclick = function () { $('#cam').value = ''; $('#cam').click(); };
    $('#bGal').onclick = function () { $('#gal').value = ''; $('#gal').click(); };
    api('GET', '/api/rc/list').then(function (rs) {
      $('#recent').innerHTML = rs.slice(0, 8).map(function (r) {
        var cls = r.status === '확인 필요' ? 'warn' : r.status === '입고 완료' ? 'ok' : '';
        return '<div class="rec"><span>' + esc(r.date) + ' <b>' + esc(r.supplier) + '</b><br><span class="muted">' + esc(r.items || '') + '</span></span>' +
          '<span style="text-align:right;white-space:nowrap">' + won(r.total) + '원<br><span class="tag ' + cls + '">' + esc(r.status || '') + '</span></span></div>';
      }).join('') || '없음';
    }).catch(function (e) { $('#recent').textContent = e.message; });
  }

  // ── 사진 → 줄이고(최대 2400px) 바로 세워서 JPEG
  function toCanvas(file) {
    var draw = function (src, w, h) {
      var k = Math.min(1, 2400 / Math.max(w, h)), c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      return c;
    };
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: 'from-image' }).then(function (b) { return draw(b, b.width, b.height); })
        .catch(function () { return viaImg(); });
    }
    return viaImg();
    function viaImg() {
      return new Promise(function (ok, no) {
        var u = URL.createObjectURL(file), im = new Image();
        im.onload = function () { URL.revokeObjectURL(u); ok(draw(im, im.naturalWidth, im.naturalHeight)); };
        im.onerror = function () { no(new Error('사진을 열 수 없습니다.')); };
        im.src = u;
      });
    }
  }
  function rotate(c) {
    var r = document.createElement('canvas'); r.width = c.height; r.height = c.width;
    var g = r.getContext('2d'); g.translate(r.width, 0); g.rotate(Math.PI / 2); g.drawImage(c, 0, 0);
    return r;
  }
  function picked(ev) {
    var f = ev.target.files && ev.target.files[0]; if (!f) return;
    $('#main').innerHTML = '<div class="busy"><div class="spin"></div>사진 준비 중…</div>';
    toCanvas(f).then(function (c) { shot = c; preview(); }).catch(function (e) { home('<div class="msg bad">' + esc(e.message) + '</div>'); });
  }
  $('#cam').onchange = picked; $('#gal').onchange = picked;

  function preview() {
    $('#main').innerHTML = '<div class="card"><img class="photo" id="ph" src="' + shot.toDataURL('image/jpeg', 0.6) + '">' +
      '<div class="row"><button class="btn" id="bRot">↻ 돌리기</button><button class="btn" id="bRe">다시 찍기</button></div>' +
      '<button class="btn pri" id="bRead">글자 읽기 →</button><div class="muted" style="margin-top:6px">글자가 똑바로 서 있지 않으면 [돌리기] 하세요. 읽는 데 5~10초 걸립니다.</div></div>';
    $('#bRot').onclick = function () { shot = rotate(shot); $('#ph').src = shot.toDataURL('image/jpeg', 0.6); };
    $('#bRe').onclick = function () { $('#cam').value = ''; $('#cam').click(); };
    $('#bRead').onclick = read;
  }
  function read() {
    $('#main').innerHTML = '<div class="busy"><div class="spin"></div>글자 읽는 중… (5~10초)</div>';
    shot.toBlob(function (blob) {
      api('POST', '/api/invoice/read?name=mobile.jpg', blob, true).then(function (r) {
        R = r;
        R.items = (r.items || []).map(function (x) {
          return { item: x.item || '', spec: x.code || x.spec || '', qty: x.qty, unit: x.unit || '', unit_price: x.unit_price, amount: x.amount, note: x.note || '' };
        });
        if (!R.items.length) R.items.push({ item: '', spec: '', qty: null, unit_price: null, amount: null });
        if (!R.date) R.date = today();
        form();
      }).catch(function (e) { preview(); toast(e.message, 5000); });
    }, 'image/jpeg', 0.88);
  }

  // ── 확인 · 고침
  function form() {
    var h = '<div class="card"><img class="photo" src="' + shot.toDataURL('image/jpeg', 0.6) + '" id="ph2" style="max-height:30vh">' +
      '<div class="muted" style="margin-top:4px">사진을 누르면 크게 봅니다. 손글씨 · 흐린 글자는 틀리게 읽을 수 있으니 꼭 확인하세요.</div></div>' +
      '<div class="card"><div class="g2"><div><label>공급자 (업체)</label><input id="fSup" value="' + esc(R.supplier || '') + '"></div>' +
      '<div><label>거래일자</label><input id="fDate" type="date" value="' + esc(R.date) + '"></div></div><div id="kind" style="margin-top:8px"></div></div>' +
      '<div id="items"></div><button class="btn" id="bAdd">+ 품목 추가</button>' +
      '<div class="card" style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span>품목 금액 합계</span><b id="sum"></b></div></div>' +
      '<button class="btn big ok" id="bSend">MES 에 등록</button><div class="row"><button class="btn" id="bBack">취소 (처음으로)</button></div>';
    $('#main').innerHTML = h;
    $('#ph2').onclick = function () { var w = window.open(); if (w) w.document.write('<img src="' + shot.toDataURL('image/jpeg', 0.9) + '" style="width:100%">'); };
    $('#fSup').oninput = kind;
    $('#bAdd').onclick = function () { sync(); R.items.push({ item: '', spec: '', qty: null, unit_price: null, amount: null }); items(); };
    $('#bBack').onclick = function () { home(); };
    $('#bSend').onclick = send;
    kind(); items();
  }
  function kind() {
    var m = isMold($('#fSup').value);
    $('#kind').innerHTML = m ? '<span class="tag ok">금형부품 업체</span> <span class="muted">품명 = 금형번호, 규격/NO = 부품번호로 금형부품 재고에 자동 입고</span>'
      : '<span class="tag">일반</span> <span class="muted">구매관리 &gt; 일반 거래명세서로 정리</span>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-lab=item]'), function (l) { l.textContent = m ? '금형번호 (품명)' : '품명'; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lab=spec]'), function (l) { l.textContent = m ? 'NO (부품번호)' : '규격'; });
  }
  function items() {
    $('#items').innerHTML = R.items.map(function (x, i) {
      return '<div class="it" data-i="' + i + '"><div class="h">품목 ' + (i + 1) + '<button class="btn x" data-del="' + i + '">빼기</button></div>' +
        '<div class="g2"><div><label data-lab="item">품명</label><input data-k="item" value="' + esc(x.item) + '"></div><div><label data-lab="spec">규격</label><input data-k="spec" value="' + esc(x.spec) + '"></div></div>' +
        '<div class="g3"><div><label>수량</label><input data-k="qty" inputmode="decimal" value="' + esc(x.qty == null ? '' : x.qty) + '"></div>' +
        '<div><label>단가</label><input data-k="unit_price" inputmode="numeric" value="' + esc(won(x.unit_price)) + '"></div>' +
        '<div><label>금액</label><input data-k="amount" inputmode="numeric" value="' + esc(won(x.amount)) + '"></div></div></div>';
    }).join('');
    kind(); total();
  }
  function sync() {
    Array.prototype.forEach.call(document.querySelectorAll('.it'), function (el) {
      var x = R.items[+el.dataset.i];
      Array.prototype.forEach.call(el.querySelectorAll('[data-k]'), function (inp) {
        var k = inp.dataset.k; x[k] = (k === 'item' || k === 'spec') ? inp.value.trim() : num(inp.value);
      });
    });
  }
  function total() { sync(); $('#sum').textContent = won(R.items.reduce(function (s, x) { return s + (x.amount != null ? x.amount : (x.qty || 0) * (x.unit_price || 0)); }, 0)) + '원'; }
  document.addEventListener('input', function (ev) {
    var inp = ev.target.closest('.it [data-k]'); if (!inp) return;
    if (inp.dataset.k === 'qty' || inp.dataset.k === 'unit_price') {       // 수량 · 단가를 고치면 금액 다시 계산
      var el = inp.closest('.it'), q = num($('[data-k=qty]', el).value), p = num($('[data-k=unit_price]', el).value);
      if (q != null && p != null) $('[data-k=amount]', el).value = won(q * p);
    }
    total();
  });
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-del]'); if (!b) return;
    sync(); R.items.splice(+b.dataset.del, 1); items();
  });
  function send() {
    sync();
    var sup = $('#fSup').value.trim(), its = R.items.filter(function (x) { return x.item; });
    if (!sup) return toast('공급자(업체)를 넣으세요.');
    if (!its.length) return toast('품목을 하나 이상 넣으세요.');
    var bad = its.filter(function (x) { return !x.qty && !x.amount; });
    if (bad.length) return toast('수량 또는 금액이 빈 품목이 있습니다: ' + bad[0].item, 4000);
    if (isMold(sup)) {
      var nos = its.filter(function (x) { return !x.spec; });
      if (nos.length) return toast('금형부품은 NO (부품번호)가 있어야 자동 입고됩니다: ' + nos[0].item, 4500);
      var nq = its.filter(function (x) { return !x.qty; });
      if (nq.length) return toast('금형부품은 수량이 있어야 입고됩니다: ' + nq[0].item, 4500);
    }
    $('#bSend').disabled = true; $('#bSend').textContent = '등록 중…';
    api('POST', '/api/rc/mobile', { token: R.token, supplier: sup, date: $('#fDate').value, doc_no: R.doc_no || '', items: its }).then(function (r) {
      var cls = r.pending ? 'warn' : 'ok';
      home('<div class="msg ' + cls + '">' + esc(r.message) +
        (r.pending ? '<br><span style="font-weight:400">못 찾은 부품은 PC 의 구매관리 &gt; 금형부품 명세서에서 처리하세요.</span>' : '') + '</div>');
      window.scrollTo(0, 0);
    }).catch(function (e) { $('#bSend').disabled = false; $('#bSend').textContent = 'MES 에 등록'; toast(e.message, 5000); });
  }

  start();
})();
</script>
</body>
</html>
